services:
  db:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hourglass
      MYSQL_USER: hourglass
      MYSQL_PASSWORD: hourglass
    ports: ["3306:3306"]
    volumes:
      - dbdata:/var/lib/mysql
      # Runs once, on first start of an empty volume (files run in name order).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
volumes:
  dbdata:
